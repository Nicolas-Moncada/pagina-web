<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Laboratorio de cultivo de tejidos vegetales con frascos y microscopio">
  <defs>
    <linearGradient id="lab-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#f7f4ee"/>
    </linearGradient>
    <linearGradient id="lab-shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5d92"/>
      <stop offset="1" stop-color="#16375f"/>
    </linearGradient>
    <linearGradient id="lab-plant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57a374"/>
      <stop offset="1" stop-color="#1e5a38"/>
    </linearGradient>
    <linearGradient id="lab-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c56a"/>
      <stop offset="1" stop-color="#b56f10"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#lab-bg)"/>

  <!-- Luz suave superior -->
  <g stroke="#f2c56a" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M150 0 L150 26"/>
    <path d="M450 0 L450 26"/>
  </g>
  <g fill="#f2c56a" opacity="0.35">
    <rect x="118" y="26" width="64" height="10" rx="5"/>
    <rect x="418" y="26" width="64" height="10" rx="5"/>
  </g>

  <!-- Piso -->
  <rect x="0" y="342" width="600" height="58" fill="#e2e9f1"/>
  <rect x="0" y="342" width="600" height="5" fill="#c3cfd9"/>

  <!-- Estantería de cultivos -->
  <g transform="translate(300 200)">
    <rect x="-190" y="-150" width="380" height="280" rx="18" fill="url(#lab-shelf)"/>
    <rect x="-172" y="-132" width="344" height="244" rx="12" fill="#1f4470"/>
    <!-- Repisas -->
    <rect x="-172" y="-48" width="344" height="10" fill="#16375f"/>
    <rect x="-172" y="62" width="344" height="10" fill="#16375f"/>
    <!-- Bandas doradas -->
    <rect x="-190" y="-158" width="380" height="8" rx="4" fill="#b56f10" opacity="0.85"/>

    <!-- Frascos nivel superior -->
    <g>
      <g transform="translate(-128 -110)">
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="#ffffff" opacity="0.32"/>
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="none" stroke="#e8f0f8" stroke-width="3"/>
        <rect x="-23" y="-28" width="46" height="12" rx="5" fill="url(#lab-gold)"/>
        <path d="M0 34 C0 16 -2 6 -12 -2 M0 34 C0 18 3 8 12 0 M0 34 L0 8" stroke="url(#lab-plant)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-12" cy="-4" rx="7" ry="4" fill="#57a374"/>
        <ellipse cx="12" cy="-2" rx="7" ry="4" fill="#57a374"/>
      </g>
      <g transform="translate(-38 -110)">
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="#ffffff" opacity="0.32"/>
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="none" stroke="#e8f0f8" stroke-width="3"/>
        <rect x="-23" y="-28" width="46" height="12" rx="5" fill="url(#lab-gold)"/>
        <path d="M0 34 C0 14 -4 4 -10 -4 M0 34 C0 18 6 8 12 2" stroke="url(#lab-plant)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-10" cy="-6" rx="7" ry="4" fill="#57a374"/>
        <ellipse cx="12" cy="0" rx="7" ry="4" fill="#57a374"/>
      </g>
      <g transform="translate(52 -110)">
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="#ffffff" opacity="0.32"/>
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="none" stroke="#e8f0f8" stroke-width="3"/>
        <rect x="-23" y="-28" width="46" height="12" rx="5" fill="url(#lab-gold)"/>
        <path d="M0 34 C0 16 2 4 -8 -4 M0 34 C0 18 -2 8 10 0" stroke="url(#lab-plant)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-8" cy="-6" rx="7" ry="4" fill="#57a374"/>
        <ellipse cx="10" cy="-2" rx="7" ry="4" fill="#57a374"/>
      </g>
      <g transform="translate(140 -110)">
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="#ffffff" opacity="0.32"/>
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="none" stroke="#e8f0f8" stroke-width="3"/>
        <rect x="-23" y="-28" width="46" height="12" rx="5" fill="url(#lab-gold)"/>
        <path d="M0 34 C0 18 -3 8 -12 0 M0 34 C0 20 4 10 12 4" stroke="url(#lab-plant)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-12" cy="-2" rx="7" ry="4" fill="#57a374"/>
        <ellipse cx="12" cy="2" rx="7" ry="4" fill="#57a374"/>
      </g>
    </g>

    <!-- Frascos nivel medio -->
    <g>
      <g transform="translate(-128 0)">
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="#ffffff" opacity="0.32"/>
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="none" stroke="#e8f0f8" stroke-width="3"/>
        <rect x="-23" y="-28" width="46" height="12" rx="5" fill="url(#lab-gold)"/>
        <path d="M0 34 C0 16 -4 6 -10 -2 M0 34 C0 18 5 8 10 2" stroke="url(#lab-plant)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-10" cy="-4" rx="7" ry="4" fill="#57a374"/>
        <ellipse cx="10" cy="0" rx="7" ry="4" fill="#57a374"/>
      </g>
      <g transform="translate(-38 0)">
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="#ffffff" opacity="0.32"/>
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="none" stroke="#e8f0f8" stroke-width="3"/>
        <rect x="-23" y="-28" width="46" height="12" rx="5" fill="url(#lab-gold)"/>
        <path d="M0 34 C0 14 -2 4 -8 -2 M0 34 C0 18 4 8 12 4" stroke="url(#lab-plant)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-8" cy="-4" rx="7" ry="4" fill="#57a374"/>
        <ellipse cx="12" cy="2" rx="7" ry="4" fill="#57a374"/>
      </g>
      <g transform="translate(52 0)">
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="#ffffff" opacity="0.32"/>
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="none" stroke="#e8f0f8" stroke-width="3"/>
        <rect x="-23" y="-28" width="46" height="12" rx="5" fill="url(#lab-gold)"/>
        <path d="M0 34 C0 16 3 6 -6 -2 M0 34 C0 18 -4 8 8 0" stroke="url(#lab-plant)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-6" cy="-4" rx="7" ry="4" fill="#57a374"/>
        <ellipse cx="8" cy="-2" rx="7" ry="4" fill="#57a374"/>
      </g>
      <g transform="translate(140 0)">
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="#ffffff" opacity="0.32"/>
        <rect x="-21" y="-18" width="42" height="56" rx="8" fill="none" stroke="#e8f0f8" stroke-width="3"/>
        <rect x="-23" y="-28" width="46" height="12" rx="5" fill="url(#lab-gold)"/>
        <path d="M0 34 C0 18 -5 8 -11 0 M0 34 C0 20 2 8 9 2" stroke="url(#lab-plant)" stroke-width="4" fill="none" stroke-linecap="round"/>
        <ellipse cx="-11" cy="-2" rx="7" ry="4" fill="#57a374"/>
        <ellipse cx="9" cy="0" rx="7" ry="4" fill="#57a374"/>
      </g>
    </g>

    <!-- Mesón inferior: matraces -->
    <g transform="translate(-120 108)">
      <path d="M-10 -22 L10 -22 L22 22 C24 30 18 34 12 34 L-12 34 C-18 34 -24 30 -22 22 Z" fill="#ffffff" opacity="0.4"/>
      <path d="M-10 -22 L10 -22 L22 22 C24 30 18 34 12 34 L-12 34 C-18 34 -24 30 -22 22 Z" fill="none" stroke="#e8f0f8" stroke-width="3"/>
      <path d="M-18 12 L18 12 L22 22 C24 30 18 34 12 34 L-12 34 C-18 34 -24 30 -22 22 Z" fill="#57a374" opacity="0.8"/>
      <rect x="-13" y="-30" width="26" height="9" rx="4" fill="url(#lab-gold)"/>
      <circle cx="0" cy="24" r="5" fill="#f2c56a" opacity="0.85"/>
    </g>
    <g transform="translate(-58 108)">
      <rect x="-14" y="-26" width="28" height="56" rx="9" fill="#ffffff" opacity="0.4"/>
      <rect x="-14" y="-26" width="28" height="56" rx="9" fill="none" stroke="#e8f0f8" stroke-width="3"/>
      <rect x="-14" y="8" width="28" height="22" rx="8" fill="#4a90d9" opacity="0.65"/>
      <rect x="-16" y="-34" width="32" height="9" rx="4" fill="url(#lab-gold)"/>
    </g>

    <!-- Libreta de registro -->
    <g transform="translate(120 112)">
      <rect x="-34" y="-20" width="68" height="40" rx="6" fill="#f6efdf"/>
      <rect x="-34" y="-20" width="10" height="40" fill="#b56f10"/>
      <g stroke="#c3b492" stroke-width="3" stroke-linecap="round">
        <path d="M-18 -8 L24 -8"/>
        <path d="M-18 2 L24 2"/>
        <path d="M-18 12 L12 12"/>
      </g>
    </g>
  </g>

  <!-- Microscopio -->
  <g transform="translate(552 258)">
    <ellipse cx="0" cy="66" rx="42" ry="10" fill="#16375f" opacity="0.15"/>
    <path d="M-34 60 C-34 48 -24 42 -12 42 L12 42 C24 42 34 48 34 60 L34 64 L-34 64 Z" fill="url(#lab-shelf)"/>
    <path d="M8 42 C8 20 2 12 -8 6" stroke="#16375f" stroke-width="14" fill="none" stroke-linecap="round"/>
    <rect x="-20" y="-14" width="16" height="24" rx="7" transform="rotate(-32 -12 -2)" fill="#16375f"/>
    <circle cx="-16" cy="-16" r="8" fill="#16375f"/>
    <rect x="-26" y="-22" width="20" height="10" rx="5" transform="rotate(-32 -16 -17)" fill="url(#lab-gold)"/>
    <rect x="20" y="10" width="10" height="30" rx="4" fill="url(#lab-gold)"/>
    <rect x="6" y="38" width="30" height="7" rx="3" fill="#9fb0c0"/>
  </g>
</svg>
