<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f2" />
      <stop offset="100%" stop-color="#d9eadf" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#invBg)" rx="20"/>
  
  <!-- Estructura de Invernadero Tipo Túnel / Capilla -->
  <path d="M120,300 L120,200 Q300,110 480,200 L480,300 Z" fill="#ffffff" opacity="0.8" stroke="#11501e" stroke-width="3"/>
  <line x1="300" y1="130" x2="300" y2="300" stroke="#11501e" stroke-width="2.5" />
  <line x1="210" y1="155" x2="210" y2="300" stroke="#65826b" stroke-width="1.5" />
  <line x1="390" y1="155" x2="390" y2="300" stroke="#65826b" stroke-width="1.5" />
  <line x1="120" y1="200" x2="480" y2="200" stroke="#65826b" stroke-width="2" />
  <line x1="120" y1="250" x2="480" y2="250" stroke="#65826b" stroke-width="1.5" />

  <!-- Eras / Bancales de forraje verde -->
  <rect x="150" y="270" width="70" height="25" rx="3" fill="#5fb343"/>
  <rect x="265" y="270" width="70" height="25" rx="3" fill="#11501e"/>
  <rect x="380" y="270" width="70" height="25" rx="3" fill="#5fb343"/>

  <text x="300" y="60" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#11501e" text-anchor="middle">Invernaderos y Forrajes</text>
  <text x="300" y="86" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#435848" text-anchor="middle">Módulos Forrajeros y Protección de Cultivos</text>
</svg>