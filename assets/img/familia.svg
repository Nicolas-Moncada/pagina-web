<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Familias campesinas asociadas frente a su casa en la montaña">
  <defs>
    <linearGradient id="fam-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dceaf7"/>
      <stop offset="0.55" stop-color="#f3ead6"/>
      <stop offset="1" stop-color="#f7f4ee"/>
    </linearGradient>
    <linearGradient id="fam-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c56a"/>
      <stop offset="1" stop-color="#b56f10"/>
    </linearGradient>
    <linearGradient id="fam-mount" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5d92"/>
      <stop offset="1" stop-color="#16375f"/>
    </linearGradient>
    <linearGradient id="fam-field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fae72"/>
      <stop offset="1" stop-color="#2f7d4f"/>
    </linearGradient>
    <linearGradient id="fam-roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5d92"/>
      <stop offset="1" stop-color="#16375f"/>
    </linearGradient>
    <linearGradient id="fam-tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8f5f"/>
      <stop offset="1" stop-color="#1e5a38"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#fam-sky)"/>

  <!-- Sol dorado -->
  <circle cx="92" cy="82" r="36" fill="url(#fam-sun)" opacity="0.95"/>
  <circle cx="92" cy="82" r="50" fill="#f2c56a" opacity="0.25"/>

  <!-- Nubes -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="300" cy="70" rx="62" ry="14"/>
    <ellipse cx="345" cy="84" rx="42" ry="11"/>
    <ellipse cx="500" cy="60" rx="50" ry="12"/>
  </g>

  <!-- Cordillera -->
  <path d="M0 255 L80 170 L165 240 L255 150 L340 238 L420 195 L515 262 L600 222 L600 400 L0 400 Z" fill="url(#fam-mount)" opacity="0.9"/>
  <path d="M0 295 L105 230 L225 300 L350 232 L465 300 L600 252 L600 400 L0 400 Z" fill="#3a6ea8"/>

  <!-- Colinas verdes -->
  <path d="M0 330 C120 295 260 322 380 312 C480 305 555 325 600 318 L600 400 L0 400 Z" fill="url(#fam-field)"/>

  <!-- Árbol -->
  <g transform="translate(55 268) scale(0.6)">
    <rect x="-6" y="26" width="12" height="46" rx="5" fill="#5d4326"/>
    <ellipse cx="0" cy="0" rx="44" ry="40" fill="url(#fam-tree)"/>
    <ellipse cx="-14" cy="8" rx="28" ry="24" fill="#3f8f5f" opacity="0.8"/>
  </g>
  <g transform="translate(548 292) scale(0.5)">
    <rect x="-6" y="26" width="12" height="46" rx="5" fill="#5d4326"/>
    <ellipse cx="0" cy="0" rx="44" ry="40" fill="url(#fam-tree)"/>
  </g>

  <!-- Casa campesina -->
  <g transform="translate(430 235)">
    <rect x="-58" y="26" width="116" height="78" rx="7" fill="#f6efdf"/>
    <rect x="-58" y="26" width="116" height="78" rx="7" fill="none" stroke="#e2d6bd" stroke-width="3"/>
    <path d="M-72 30 L0 -34 L72 30 Z" fill="url(#fam-roof)"/>
    <path d="M-72 30 L0 -34 L72 30" fill="none" stroke="#0f2643" stroke-width="4" stroke-linejoin="round"/>
    <rect x="34" y="-18" width="14" height="26" rx="4" fill="#8a6a43"/>
    <rect x="-16" y="46" width="30" height="58" rx="5" fill="#8a6a43"/>
    <circle cx="8" cy="76" r="3" fill="#f2c56a"/>
    <circle cx="26" cy="56" r="11" fill="#dceaf7" stroke="#5d4326" stroke-width="3"/>
  </g>

  <!-- Familia asociada -->
  <g transform="translate(185 305)">
    <ellipse cx="40" cy="88" rx="120" ry="14" fill="#16375f" opacity="0.12"/>
    <!-- Padre -->
    <g>
      <circle cx="-38" cy="-42" r="13" fill="#e8b98e"/>
      <ellipse cx="-38" cy="-56" rx="24" ry="6" fill="#b56f10"/>
      <path d="M-54 -60 A16 10 0 0 1 -22 -60 L-22 -56 A16 8 0 0 0 -54 -56 Z" fill="#b56f10"/>
      <path d="M-58 86 C-58 22 -50 -22 -38 -26 C-26 -22 -18 22 -18 86 Z" fill="#16375f"/>
    </g>
    <!-- Madre -->
    <g>
      <circle cx="4" cy="-36" r="12" fill="#e8b98e"/>
      <path d="M-8 -48 A14 10 0 0 1 16 -44 L16 -36 A16 12 0 0 0 -8 -40 Z" fill="#f2c56a"/>
      <path d="M-14 86 C-14 18 -7 -18 4 -22 C15 -18 22 18 22 86 Z" fill="#b56f10"/>
    </g>
    <!-- Hijo -->
    <g>
      <circle cx="40" cy="-18" r="9" fill="#e8b98e"/>
      <path d="M30 86 C30 26 34 0 40 -2 C46 0 50 26 50 86 Z" fill="#2b5d92"/>
    </g>
    <!-- Cariño: unión entre manos -->
    <circle cx="-18" cy="14" r="4" fill="#e8b98e"/>
    <circle cx="22" cy="8" r="3.4" fill="#e8b98e"/>
  </g>

  <!-- Cántaro de leche -->
  <g transform="translate(150 356)">
    <rect x="-14" y="-22" width="28" height="44" rx="6" fill="#f2c56a"/>
    <rect x="-17" y="-30" width="34" height="10" rx="4" fill="#b56f10"/>
    <path d="M-14 -12 L-24 4 L-24 22" fill="none" stroke="#b56f10" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Cerca -->
  <g stroke="#8a6a43" stroke-width="5" stroke-linecap="round">
    <path d="M258 372 L258 342"/>
    <path d="M296 372 L296 342"/>
    <path d="M334 372 L334 344"/>
    <path d="M246 356 L348 356"/>
  </g>
</svg>
