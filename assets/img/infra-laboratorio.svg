<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f2" />
      <stop offset="100%" stop-color="#e0efe4" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#labBg)" rx="20"/>
  
  <!-- Frascos de cultivo in vitro con plántulas -->
  <g transform="translate(140, 160)">
    <!-- Frasco 1 -->
    <rect x="0" y="40" width="70" height="90" rx="12" fill="#ffffff" stroke="#65826b" stroke-width="2.5" opacity="0.9"/>
    <rect x="10" y="30" width="50" height="15" rx="4" fill="#11501e"/>
    <rect x="5" y="100" width="60" height="24" rx="6" fill="#8fa993" opacity="0.4"/>
    <!-- Brote vegetal -->
    <path d="M35,100 Q30,65 35,55 Q40,65 35,100" fill="#5fb343" />
    <path d="M35,75 Q20,68 18,58 Q28,62 35,75" fill="#5fb343" />
    <path d="M35,70 Q50,62 52,52 Q42,58 35,70" fill="#5fb343" />
  </g>

  <g transform="translate(250, 140)">
    <!-- Frasco 2 (Central) -->
    <rect x="0" y="40" width="85" height="110" rx="14" fill="#ffffff" stroke="#65826b" stroke-width="2.5" opacity="0.95"/>
    <rect x="12" y="28" width="61" height="16" rx="4" fill="#11501e"/>
    <rect x="6" y="115" width="73" height="28" rx="8" fill="#8fa993" opacity="0.4"/>
    <!-- Brotes de papa / tubérculo -->
    <path d="M42,115 Q36,70 42,55 Q48,70 42,115" fill="#11501e" />
    <path d="M42,85 Q22,78 20,65 Q34,70 42,85" fill="#5fb343" />
    <path d="M42,80 Q62,72 65,58 Q52,65 42,80" fill="#5fb343" />
  </g>

  <g transform="translate(375, 160)">
    <!-- Frasco 3 -->
    <rect x="0" y="40" width="70" height="90" rx="12" fill="#ffffff" stroke="#65826b" stroke-width="2.5" opacity="0.9"/>
    <rect x="10" y="30" width="50" height="15" rx="4" fill="#11501e"/>
    <rect x="5" y="100" width="60" height="24" rx="6" fill="#8fa993" opacity="0.4"/>
    <path d="M35,100 Q30,65 35,55 Q40,65 35,100" fill="#5fb343" />
    <path d="M35,75 Q20,68 18,58 Q28,62 35,75" fill="#5fb343" />
  </g>

  <text x="300" y="60" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#11501e" text-anchor="middle">Laboratorio de Cultivo</text>
  <text x="300" y="86" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#435848" text-anchor="middle">Propagación y Biotecnología de Tejidos Vegetales</text>
</svg>