<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="bgTanque" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f2" />
      <stop offset="100%" stop-color="#d9eadf" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgTanque)" rx="20"/>
  <ellipse cx="300" cy="340" rx="220" ry="24" fill="#11501e" opacity="0.12"/>
  
  <!-- Tanque Horizontal en Acero Inoxidable -->
  <rect x="150" y="140" width="300" height="150" rx="28" fill="url(#tankGrad)" stroke="#475569" stroke-width="3"/>
  <ellipse cx="150" cy="215" rx="32" ry="75" fill="#64748b" stroke="#475569" stroke-width="3"/>
  <ellipse cx="450" cy="215" rx="32" ry="75" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
  
  <!-- Soportes de Apoyo -->
  <rect x="200" y="285" width="20" height="45" rx="4" fill="#334155"/>
  <rect x="380" y="285" width="20" height="45" rx="4" fill="#334155"/>
  
  <!-- Tapa Superior de Inspección -->
  <ellipse cx="300" cy="140" rx="45" ry="16" fill="#475569"/>
  <ellipse cx="300" cy="136" rx="38" ry="12" fill="#cbd5e1"/>
  <circle cx="300" cy="134" r="7" fill="#1e293b"/>
  
  <!-- Placa Institucional -->
  <rect x="235" y="185" width="130" height="35" rx="6" fill="#11501e"/>
  <text x="300" y="207" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ASOAGROALIZAL</text>
  
  <text x="300" y="60" font-family="'Fraunces', serif" font-size="22" font-weight="700" fill="#11501e" text-anchor="middle">Tanques de Enfriamiento</text>
  <text x="300" y="86" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#435848" text-anchor="middle">Conservación Colectiva en Acero Inoxidable</text>
</svg>