<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9" />
      <stop offset="100%" stop-color="#c8e6c9" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bgGrad)" rx="24"/>
  <ellipse cx="300" cy="340" rx="220" ry="24" fill="#0b2914" opacity="0.15"/>
  <!-- Tanque de Enfriamiento en Acero Inoxidable -->
  <rect x="160" y="140" width="280" height="150" rx="30" fill="url(#tankGrad)" stroke="#475569" stroke-width="4"/>
  <ellipse cx="160" cy="215" rx="30" ry="75" fill="#64748b" stroke="#475569" stroke-width="4"/>
  <ellipse cx="440" cy="215" rx="30" ry="75" fill="#cbd5e1" stroke="#475569" stroke-width="4"/>
  <!-- Patas de soporte -->
  <rect x="210" y="280" width="18" height="50" rx="6" fill="#334155"/>
  <rect x="372" y="280" width="18" height="50" rx="6" fill="#334155"/>
  <!-- Tapa superior / Manhole -->
  <ellipse cx="300" cy="140" rx="45" ry="16" fill="#475569"/>
  <ellipse cx="300" cy="136" rx="38" ry="12" fill="#94a3b8"/>
  <circle cx="300" cy="134" r="7" fill="#1e293b"/>
  <!-- Indicador digital de temperatura (4°C) -->
  <rect x="260" y="195" width="80" height="40" rx="8" fill="#0f172a"/>
  <text x="300" y="222" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="middle">4.0 °C</text>
  <!-- Rótulo AsoagroAlisal -->
  <rect x="250" y="165" width="100" height="18" rx="4" fill="#144722"/>
  <text x="300" y="178" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fef08a" text-anchor="middle">ASOAGROALIZAL</text>
  <text x="300" y="70" font-family="sans-serif" font-size="22" font-weight="900" fill="#144722" text-anchor="middle">Tanques de Enfriamiento</text>
  <text x="300" y="98" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2e7d32" text-anchor="middle">Capacidad y Conservación a 4°C en Finca</text>
</svg>

