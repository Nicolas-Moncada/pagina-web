<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Tanque de enfriamiento de leche en acero inoxidable">
  <defs>
    <linearGradient id="tk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef3f9"/>
      <stop offset="1" stop-color="#f7f4ee"/>
    </linearGradient>
    <linearGradient id="tk-steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3cfd9"/>
      <stop offset="0.18" stop-color="#f2f6fa"/>
      <stop offset="0.5" stop-color="#dbe3ea"/>
      <stop offset="0.82" stop-color="#f2f6fa"/>
      <stop offset="1" stop-color="#c3cfd9"/>
    </linearGradient>
    <linearGradient id="tk-lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b7c3ce"/>
      <stop offset="0.5" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#b7c3ce"/>
    </linearGradient>
    <linearGradient id="tk-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5d92"/>
      <stop offset="1" stop-color="#16375f"/>
    </linearGradient>
    <linearGradient id="tk-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c56a"/>
      <stop offset="1" stop-color="#b56f10"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#tk-bg)"/>

  <!-- Halo suave -->
  <circle cx="285" cy="185" r="150" fill="#f2c56a" opacity="0.14"/>

  <!-- Pared con baldosas sutiles -->
  <g stroke="#d7e1ec" stroke-width="2" opacity="0.6">
    <path d="M0 60 L600 60"/>
    <path d="M0 120 L600 120"/>
    <path d="M100 0 L100 60"/>
    <path d="M300 0 L300 60"/>
    <path d="M500 0 L500 60"/>
  </g>

  <!-- Piso -->
  <rect x="0" y="330" width="600" height="70" fill="#dfe7f0"/>
  <rect x="0" y="330" width="600" height="6" fill="#c3cfd9"/>

  <!-- Sombra -->
  <ellipse cx="275" cy="348" rx="170" ry="16" fill="#16375f" opacity="0.14"/>

  <!-- Copo de frío -->
  <g stroke="#4a90d9" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M128 92 L128 128"/>
    <path d="M114 102 L142 118"/>
    <path d="M142 102 L114 118"/>
  </g>
  <g stroke="#4a90d9" stroke-width="3.4" stroke-linecap="round" opacity="0.55">
    <path d="M96 150 L96 174"/>
    <path d="M86 156 L106 168"/>
    <path d="M106 156 L86 168"/>
  </g>

  <!-- Tanque principal -->
  <g transform="translate(275 190)">
    <!-- Patas -->
    <rect x="-88" y="128" width="22" height="42" rx="8" fill="#9fb0c0"/>
    <rect x="66" y="128" width="22" height="42" rx="8" fill="#9fb0c0"/>
    <!-- Cuerpo -->
    <rect x="-122" y="-104" width="244" height="248" rx="30" fill="url(#tk-steel)"/>
    <!-- Domo superior -->
    <ellipse cx="0" cy="-104" rx="122" ry="36" fill="url(#tk-lid)"/>
    <ellipse cx="0" cy="-104" rx="122" ry="36" fill="none" stroke="#aebbc8" stroke-width="3"/>
    <!-- Escotilla -->
    <circle cx="0" cy="-108" r="17" fill="#c3cfd9" stroke="#8fa0b0" stroke-width="4"/>
    <circle cx="0" cy="-108" r="7" fill="#16375f"/>
    <!-- Bandas de refuerzo -->
    <g stroke="#aebbc8" stroke-width="5" fill="none">
      <path d="M-120 -44 C-60 -30 60 -30 120 -44"/>
      <path d="M-118 46 C-60 60 60 60 118 46"/>
    </g>
    <!-- Sello inferior -->
    <rect x="-122" y="118" width="244" height="16" rx="8" fill="#b7c3ce"/>
    <!-- Marcado de nivel -->
    <rect x="98" y="-70" width="10" height="120" rx="5" fill="#dbe3ea"/>
    <rect x="98" y="-8" width="10" height="42" rx="5" fill="url(#tk-gold)"/>
    <!-- Insignia ASOAGRO -->
    <circle cx="-58" cy="10" r="34" fill="#ffffff" stroke="#c3cfd9" stroke-width="4"/>
    <path d="M-58 -12 C-70 4 -68 18 -58 26 C-48 18 -46 4 -58 -12 Z" fill="#b56f10"/>
    <path d="M-58 -4 C-64 6 -63 14 -58 18 C-53 14 -52 6 -58 -4 Z" fill="#f2c56a"/>
    <path d="M-70 18 C-64 26 -52 26 -46 18" stroke="#16375f" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Tubería hacia el panel -->
  <path d="M395 210 L470 210 L470 168" fill="none" stroke="#9fb0c0" stroke-width="12" stroke-linecap="round"/>
  <circle cx="470" cy="162" r="9" fill="#b56f10"/>

  <!-- Panel de control -->
  <g transform="translate(520 168)">
    <rect x="-38" y="-38" width="76" height="112" rx="12" fill="url(#tk-panel)"/>
    <rect x="-26" y="-26" width="52" height="34" rx="6" fill="#0d1f36"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#f2c56a">4°C</text>
    <circle cx="-13" cy="24" r="6" fill="#57a374"/>
    <circle cx="13" cy="24" r="6" fill="#f2c56a"/>
    <rect x="-20" y="40" width="40" height="9" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="-20" y="56" width="28" height="9" rx="4" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- Base decorativa -->
  <g fill="#9fb0c0" opacity="0.55">
    <circle cx="60" cy="360" r="7"/>
    <circle cx="540" cy="366" r="9"/>
  </g>
</svg>
