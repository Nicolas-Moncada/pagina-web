<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Paisaje andino de la Vereda Alizal">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dceaf7"/>
      <stop offset="0.55" stop-color="#f3ead6"/>
      <stop offset="1" stop-color="#f7f4ee"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c56a"/>
      <stop offset="1" stop-color="#b56f10"/>
    </linearGradient>
    <linearGradient id="mount1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6ea8"/>
      <stop offset="1" stop-color="#26507f"/>
    </linearGradient>
    <linearGradient id="mount2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5d92"/>
      <stop offset="1" stop-color="#16375f"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fae72"/>
      <stop offset="1" stop-color="#2f7d4f"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8f5f"/>
      <stop offset="1" stop-color="#1e5a38"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Sol dorado -->
  <circle cx="640" cy="105" r="52" fill="url(#sun)" opacity="0.95"/>
  <circle cx="640" cy="105" r="70" fill="#f2c56a" opacity="0.25"/>

  <!-- Nubes suaves -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="200" cy="90" rx="70" ry="16"/>
    <ellipse cx="250" cy="105" rx="50" ry="12"/>
    <ellipse cx="520" cy="60" rx="56" ry="12"/>
  </g>

  <!-- Cordilleras lejanas -->
  <path d="M0 300 L110 190 L200 262 L300 160 L400 250 L470 205 L560 290 L660 200 L760 270 L800 240 L800 500 L0 500 Z" fill="url(#mount2)" opacity="0.9"/>
  <path d="M0 330 L90 240 L210 315 L330 220 L450 305 L570 235 L690 320 L800 260 L800 500 L0 500 Z" fill="url(#mount1)"/>

  <!-- Colinas verdes -->
  <path d="M0 380 C160 320 320 360 460 350 C600 340 700 370 800 355 L800 500 L0 500 Z" fill="url(#field)"/>

  <!-- Surcos -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M-10 420 C 180 400, 420 430, 810 405"/>
    <path d="M-10 455 C 200 435, 430 465, 810 440"/>
    <path d="M-10 488 C 210 470, 440 495, 810 472"/>
  </g>

  <!-- Árboles de aliso -->
  <g>
    <g transform="translate(120 330)">
      <rect x="-6" y="26" width="12" height="46" rx="5" fill="#5d4326"/>
      <ellipse cx="0" cy="0" rx="44" ry="42" fill="url(#tree)"/>
      <ellipse cx="-14" cy="8" rx="30" ry="26" fill="#3f8f5f" opacity="0.8"/>
      <ellipse cx="16" cy="-6" rx="26" ry="24" fill="#57a374" opacity="0.7"/>
    </g>
    <g transform="translate(700 350) scale(0.85)">
      <rect x="-6" y="26" width="12" height="46" rx="5" fill="#5d4326"/>
      <ellipse cx="0" cy="0" rx="44" ry="42" fill="url(#tree)"/>
      <ellipse cx="-12" cy="6" rx="28" ry="24" fill="#3f8f5f" opacity="0.8"/>
    </g>
    <g transform="translate(240 366) scale(0.62)">
      <rect x="-6" y="26" width="12" height="46" rx="5" fill="#5d4326"/>
      <ellipse cx="0" cy="0" rx="44" ry="40" fill="url(#tree)"/>
    </g>
  </g>

  <!-- Vaca lechera estilizada -->
  <g transform="translate(560 428) scale(0.9)">
    <path d="M-52 8 C-56 -22 -30 -34 0 -34 C30 -34 54 -22 50 8 C46 26 30 30 0 30 C-30 30 -48 26 -52 8 Z" fill="#ffffff"/>
    <path d="M-52 8 C-56 -22 -30 -34 0 -34 C6 -34 12 -33 18 -31 C-6 -26 -24 -12 -22 12 C-16 28 0 30 0 30 C-30 30 -48 26 -52 8 Z" fill="#16375f" opacity="0.85"/>
    <circle cx="38" cy="-2" r="3.4" fill="#16375f"/>
    <path d="M40 -34 L44 -52 L52 -50" stroke="#5d4326" stroke-width="7" stroke-linecap="round" fill="none"/>
    <ellipse cx="14" cy="30" rx="7" ry="5" fill="#101c2b"/>
    <ellipse cx="-20" cy="30" rx="7" ry="5" fill="#101c2b"/>
  </g>

  <!-- Cerca aliso -->
  <g stroke="#8a6a43" stroke-width="6" stroke-linecap="round">
    <path d="M330 448 L330 412"/>
    <path d="M376 448 L376 412"/>
    <path d="M422 448 L422 412"/>
    <path d="M316 424 L436 424"/>
  </g>
</svg>
