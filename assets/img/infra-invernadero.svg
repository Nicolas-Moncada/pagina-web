<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Invernadero con módulos forrajeros y hortalizas en crecimiento">
  <defs>
    <linearGradient id="inv-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dceaf7"/>
      <stop offset="1" stop-color="#f7f4ee"/>
    </linearGradient>
    <linearGradient id="inv-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2c56a"/>
      <stop offset="1" stop-color="#b56f10"/>
    </linearGradient>
    <linearGradient id="inv-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fae72"/>
      <stop offset="1" stop-color="#2f7d4f"/>
    </linearGradient>
    <linearGradient id="inv-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4f5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#eef5fb" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="inv-plant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57a374"/>
      <stop offset="1" stop-color="#1e5a38"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#inv-sky)"/>

  <!-- Sol -->
  <circle cx="518" cy="72" r="34" fill="url(#inv-sun)" opacity="0.95"/>
  <circle cx="518" cy="72" r="48" fill="#f2c56a" opacity="0.25"/>

  <!-- Nubes -->
  <g fill="#ffffff" opacity="0.75">
    <ellipse cx="150" cy="62" rx="58" ry="13"/>
    <ellipse cx="196" cy="76" rx="40" ry="10"/>
  </g>

  <!-- Colinas -->
  <path d="M0 250 C90 205 170 235 260 218 C360 200 470 230 600 205 L600 400 L0 400 Z" fill="#3a6ea8" opacity="0.9"/>

  <!-- Terreno -->
  <rect x="0" y="268" width="600" height="132" fill="url(#inv-ground)"/>

  <!-- Invernadero -->
  <g transform="translate(300 0)">
    <!-- Cubierta translúcida -->
    <path d="M-235 320 C-235 130 235 130 235 320 L235 330 L-235 330 Z" fill="url(#inv-glass)"/>
    <!-- Ribs del marco -->
    <g stroke="#ffffff" stroke-width="6" fill="none" opacity="0.95">
      <path d="M-235 320 C-235 130 235 130 235 320"/>
      <path d="M-158 300 C-158 175 158 175 158 300" stroke-width="4"/>
      <path d="M-79 312 C-79 205 79 205 79 312" stroke-width="4"/>
      <path d="M0 316 L0 152" stroke-width="4"/>
    </g>
    <!-- Reflejos -->
    <path d="M-150 200 C-120 160 -70 140 -30 136 L-60 190 Z" fill="#ffffff" opacity="0.5"/>
    <!-- Estructura base -->
    <path d="M-235 320 L-235 338 L235 338 L235 320" fill="none" stroke="#16375f" stroke-width="10"/>
    <path d="M-235 338 L235 338" stroke="#16375f" stroke-width="6"/>
    <!-- Puerta -->
    <rect x="-30" y="252" width="60" height="86" rx="6" fill="#16375f"/>
    <rect x="-22" y="260" width="44" height="78" rx="5" fill="#2b5d92"/>
    <circle cx="14" cy="300" r="4.5" fill="#f2c56a"/>
  </g>

  <!-- Cultivos forrajeros bajo techo -->
  <g>
    <path d="M110 322 C150 300 190 322 232 312 C276 300 316 322 358 314 C400 306 440 320 486 314 L486 338 L110 338 Z" fill="#2f7d4f"/>
    <g stroke="url(#inv-plant)" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M140 328 C138 310 132 304 126 300"/>
      <path d="M140 328 C142 312 150 306 156 302"/>
      <path d="M196 326 C194 308 188 302 182 298"/>
      <path d="M196 326 C198 310 206 304 212 300"/>
      <path d="M252 326 C250 308 246 300 240 296"/>
      <path d="M252 326 C254 310 260 304 266 300"/>
      <path d="M308 324 C306 306 300 300 294 296"/>
      <path d="M308 324 C310 308 316 302 322 298"/>
      <path d="M364 326 C362 308 358 300 352 296"/>
      <path d="M364 326 C366 310 372 304 378 300"/>
      <path d="M420 328 C418 310 414 302 408 298"/>
      <path d="M420 328 C422 312 428 306 434 302"/>
    </g>
    <g fill="#57a374">
      <ellipse cx="126" cy="298" rx="8" ry="5"/>
      <ellipse cx="156" cy="300" rx="8" ry="5"/>
      <ellipse cx="182" cy="296" rx="8" ry="5"/>
      <ellipse cx="212" cy="298" rx="8" ry="5"/>
      <ellipse cx="240" cy="294" rx="8" ry="5"/>
      <ellipse cx="266" cy="298" rx="8" ry="5"/>
      <ellipse cx="294" cy="294" rx="8" ry="5"/>
      <ellipse cx="322" cy="296" rx="8" ry="5"/>
      <ellipse cx="352" cy="294" rx="8" ry="5"/>
      <ellipse cx="378" cy="298" rx="8" ry="5"/>
      <ellipse cx="408" cy="296" rx="8" ry="5"/>
      <ellipse cx="434" cy="300" rx="8" ry="5"/>
    </g>
  </g>

  <!-- Planta brotando junto a la puerta -->
  <g transform="translate(372 336)">
    <path d="M0 0 C2 -18 0 -28 -4 -36 M0 -18 C-8 -24 -12 -32 -12 -40 M0 -18 C8 -22 12 -30 12 -38" stroke="#2f7d4f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-12" cy="-44" rx="9" ry="6" fill="#57a374"/>
    <ellipse cx="13" cy="-42" rx="9" ry="6" fill="#57a374"/>
  </g>

  <!-- Riego por goteo -->
  <g stroke="#4a90d9" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M150 268 L150 286"/>
    <path d="M255 266 L255 284"/>
    <path d="M400 270 L400 288"/>
  </g>
</svg>
